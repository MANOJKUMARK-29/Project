<div class="charts-mainpage">
  <div class="chart-card">


    <div class="chart-container" >
      <div class="export-buttons-bar">
        <h2>Machine Status</h2>
        <button type="button" class="btn btn-danger"  title="Download PDF" id="barchart" (click)="downloadBarPdf()">
          <i class="bi bi-file-earmark-pdf"></i>
        </button>
    </div>
      <canvas id="barChart" class="bar-chart" baseChart [data]="myData" [options]="myOptions" [type]="'bar'">
      </canvas>
    </div>
  </div>

  <div class="piechart-card">

    <div class="piechart-container" >
      <div class="export-buttons-pie">
        <h2>Attendance Status</h2>
        <button type="button" class="btn btn-danger"  title="Download PDF" (click)="downloadPiePdf()">
          <i class="bi bi-file-earmark-pdf"></i>

        </button>
    </div>

      <canvas id="pieChart" class="pie-chart" baseChart [data]="pieChartData" [options]="pieChartOptions" [plugins]="pieChartPlugins"
        [type]="pieChartType" (chartClick)="onPiechartClick($event)">
      </canvas>

    </div>
  </div>
</div>
<div class="table-charts-layout">
  <!-- <div class="attendance-table" id="table"> -->
    <div class="export-buttons-table">
      <h2 class="table-head">Machine Status Data</h2>
      <div class="table-action-buttons">
        <button type="button" class="btn btn-danger" title="Download PDF" (click)="downloadTabPdf()">
          <i class="bi bi-file-earmark-pdf"></i>
        </button>
        <button type="button" class="btn btn-success" title="Download xls" (click)="downloadTableExcel()">
          <i class="bi bi-file-earmark-excel"></i>
        </button>
      </div>
    </div>
    <div id="tableXl">
    <p-table class="table" #tbl [value]="tableData" [tableStyle]="{'min-width':'60rem'}" responsiveLayout="scroll"
      stripedRows="true" showGridlines="true">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="SNo">S.No<p-sortIcon field="SNo"></p-sortIcon></th>
          <th pSortableColumn="Location">Location<p-sortIcon field="Location"></p-sortIcon></th>
          <th pSortableColumn="MachineOn">Machine ON<p-sortIcon field="MachineOn"></p-sortIcon></th>
          <th pSortableColumn="MachineOff">Machine OFF<p-sortIcon field="MachineOff"></p-sortIcon></th>
          <th pSortableColumn="PresentEmployees">Present<p-sortIcon field="PresentEmployees"></p-sortIcon></th>
          <th pSortableColumn="AbsentEmployees">Absent<p-sortIcon field="AbsentEmployees"></p-sortIcon></th>
          <th pSortableColumn="totalEmployees">Total Employees<p-sortIcon field="totalEmployees"></p-sortIcon></th>
        </tr>
        <tr>
              <td><input pInputText
               type="text"
               (input)="tbl.filter($any($event.target).value,'SNo','equals')"
               placeholder="Search SNo"></td>
               <td><input pInputText
               type="text"
               (input)="tbl.filter($any($event.target).value,'Location','contains')"
               placeholder="Search Location"></td>
               <td><input pInputText
               type="text"
               (input)="tbl.filter($any($event.target).value,'MachineOn','equals')"
               placeholder="Search MachineOn"></td>
               <td><input pInputText
               type="text"
               (input)="tbl.filter($any($event.target).value,'MachineOff','equals')"
               placeholder="Search MachineOff"></td>
               <td><input pInputText
               type="text"
               (input)="tbl.filter($any($event.target).value,'PresentEmployees','equals')"
               placeholder="Search PresentEmployees"></td>
               <td><input pInputText
               type="text"
               (input)="tbl.filter($any($event.target).value,'AbsentEmployees','equals')"
               placeholder="Search AbsentEmployees"></td>
               <td><input pInputText
               type="text"
               (input)="tbl.filter($any($event.target).value,'totalEmployees','equals')"
               placeholder="Search totalEmployees"></td>
            </tr>
      </ng-template>

      <ng-template pTemplate="body" let-row>
        <tr>
          <td>{{ row.SNo }}</td>
          <td>{{ row.Location }}</td>
          <td>{{ row.MachineOn }}</td>
          <td>{{ row.MachineOff }}</td>
          <td>{{ row.PresentEmployees }}</td>
          <td>{{ row.AbsentEmployees }}</td>
          <td>{{ row.totalEmployees }}</td>
        </tr>
      </ng-template>
    </p-table>

  </div>
</div>
